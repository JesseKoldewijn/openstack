name: PR Version Label

on:
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write

concurrency:
  group: pr-version-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  set-pr-version-label:
    name: Set @version label
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR RC version tag
        id: compute
        run: |
          set -euo pipefail
          git fetch --tags --force

          base_rc_tag="$(git tag --list 'v*-rc-*' --sort=-version:refname | head -n 1)"
          if [[ -z "$base_rc_tag" ]]; then
            workspace_version="$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
            base_rc_tag="v${workspace_version}-rc-1"
          fi

          pr_number="${{ github.event.pull_request.number }}"
          pr_rc_tag="${base_rc_tag}.pr-${pr_number}"
          echo "pr_rc_tag=${pr_rc_tag}" >> "$GITHUB_OUTPUT"
          echo "Computed PR RC tag: ${pr_rc_tag}"

      - name: Upsert PR @version label
        uses: actions/github-script@v7
        env:
          PR_RC_TAG: ${{ steps.compute.outputs.pr_rc_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const newLabel = `@version:${process.env.PR_RC_TAG}`;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: newLabel });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: newLabel,
                  color: '1d76db',
                  description: 'Computed RC preview version for this PR',
                });
              } else {
                throw err;
              }
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
            });

            for (const l of currentLabels) {
              if (l.name.startsWith('@version:') && l.name !== newLabel) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: l.name,
                });
              }
            }

            if (!currentLabels.some(l => l.name === newLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [newLabel],
              });
            }

            core.notice(`PR #${issue_number} version label set to ${newLabel}`);
