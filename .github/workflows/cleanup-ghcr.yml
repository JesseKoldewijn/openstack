name: Cleanup GHCR

on:
  schedule:
    # Daily at 04:00 UTC — one hour after the nightly Docker build (03:00 UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — list versions that would be deleted without actually deleting them"
        type: boolean
        default: false

permissions:
  packages: write

jobs:
  cleanup-untagged:
    name: Delete untagged container versions (>7 days old)
    runs-on: ubuntu-latest
    steps:
      - name: Purge old untagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="openstack"
          OWNER="${{ github.repository_owner }}"
          # Versions created before this ISO-8601 timestamp are eligible for deletion.
          CUTOFF="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"

          echo "Cutoff: ${CUTOFF}"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          deleted=0
          skipped=0
          errors=0

          # Fetch every version of the package (paginated).
          while IFS= read -r entry; do
            version_id="$(printf '%s' "$entry" | jq -r '.id')"
            created_at="$(printf '%s' "$entry" | jq -r '.created_at')"
            tags="$(printf '%s' "$entry" | jq -c '.metadata.container.tags')"

            # Only target genuinely untagged versions.
            if [ "$tags" != "[]" ] && [ "$tags" != "null" ]; then
              continue
            fi

            # Only target versions older than the cutoff.
            if [[ "$created_at" > "$CUTOFF" ]]; then
              skipped=$((skipped + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] Would delete version ${version_id} (created: ${created_at})"
              deleted=$((deleted + 1))
            else
              if gh api -X DELETE \
                  "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}" \
                  > /dev/null 2>&1; then
                echo "Deleted version ${version_id} (created: ${created_at})"
                deleted=$((deleted + 1))
              else
                echo "::warning::Failed to delete version ${version_id} (created: ${created_at})" >&2
                errors=$((errors + 1))
              fi
            fi
          done < <(gh api \
            "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
            --paginate \
            --jq '.[] | {id: .id, created_at: .created_at, metadata: .metadata}')

          echo ""
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run complete — would have deleted ${deleted} version(s). ${skipped} recent untagged version(s) preserved. ${errors} error(s)."
          else
            echo "Done — deleted ${deleted} version(s). ${skipped} recent untagged version(s) preserved. ${errors} error(s)."
          fi

          # Fail the job if we hit errors but deleted nothing — likely a permissions issue.
          if [ "$errors" -gt 0 ] && [ "$deleted" -eq 0 ]; then
            echo "::error::All deletion attempts failed. Check that GITHUB_TOKEN has packages: write scope."
            exit 1
          fi

  cleanup-legacy-and-ephemeral-tags:
    name: Delete legacy release tags and stale beta-sha tags (>14 days old)
    runs-on: ubuntu-latest
    steps:
      - name: Purge legacy/stale tagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="openstack"
          OWNER="${{ github.repository_owner }}"
          CUTOFF="$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')"

          deleted=0
          skipped=0

          while IFS= read -r entry; do
            version_id="$(printf '%s' "$entry" | jq -r '.id')"
            created_at="$(printf '%s' "$entry" | jq -r '.created_at')"
            tags_json="$(printf '%s' "$entry" | jq -c '.metadata.container.tags // []')"

            mapfile -t tags < <(printf '%s' "$tags_json" | jq -r '.[]')
            [[ ${#tags[@]} -eq 0 ]] && continue

            delete=false
            for t in "${tags[@]}"; do
              # Legacy patterns to purge from old release-plz/rc/pr preview setup.
              if [[ "$t" =~ ^rc($|-) ]] || [[ "$t" =~ ^pr-[0-9]+$ ]] || [[ "$t" =~ \.pr-[0-9]+$ ]]; then
                delete=true
                break
              fi

              # New beta-<sha> tags are ephemeral; purge old ones only.
              if [[ "$t" =~ ^beta-[0-9a-f]{7}$ ]] && [[ "$created_at" < "$CUTOFF" ]]; then
                delete=true
                break
              fi
            done

            if [[ "$delete" != true ]]; then
              skipped=$((skipped + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] Would delete version ${version_id} (tags: ${tags[*]})"
              deleted=$((deleted + 1))
              continue
            fi

            if gh api -X DELETE \
                "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}" \
                > /dev/null 2>&1; then
              echo "Deleted version ${version_id} (tags: ${tags[*]})"
              deleted=$((deleted + 1))
            else
              echo "::warning::Failed to delete version ${version_id} (tags: ${tags[*]})"
            fi
          done < <(gh api \
            "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
            --paginate \
            --jq '.[] | {id: .id, created_at: .created_at, metadata: .metadata}')

          echo "Cleanup complete — deleted ${deleted}; skipped ${skipped}."
