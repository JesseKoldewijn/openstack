name: Release (tag + GitHub release)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Run release-plz release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight release tag check
        id: preflight
        run: |
          set -euo pipefail
          git fetch --tags --force

          workspace_version="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace_package=1; next }
            /^\[/ { in_workspace_package=0 }
            in_workspace_package && /^version = / { print $2; exit }
          ' Cargo.toml)"

          if [[ -z "$workspace_version" ]]; then
            echo "Unable to determine [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi

          target_tag="v${workspace_version}"
          echo "target_tag=${target_tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify -q "refs/tags/${target_tag}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag ${target_tag} already exists — skipping release-plz run."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release tag ${target_tag} does not exist — running release-plz."
          fi

      - name: Run release-plz (release)
        if: steps.preflight.outputs.tag_exists != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
          config: .release-plz.toml
        env:
          # Prefer a PAT so tag pushes can trigger downstream tag workflows
          # (e.g. cross-compile on v* tags). Falls back to GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Skip summary
        if: steps.preflight.outputs.tag_exists == 'true'
        run: |
          {
            echo "## Release workflow"
            echo ""
            echo "Skipped release-plz: tag already exists (\`${{ steps.preflight.outputs.target_tag }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
