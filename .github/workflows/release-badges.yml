name: Update Release Badges

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-badges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Update stable/beta badge JSON on gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'gh-pages';

            const parseStable = (tag) => {
              const m = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);
              if (!m) return null;
              return { tag, major:+m[1], minor:+m[2], patch:+m[3] };
            };
            const parseBeta = (tag) => {
              const m = /^v(\d+)\.(\d+)\.(\d+)-beta\.(\d+)$/.exec(tag);
              if (!m) return null;
              return { tag, major:+m[1], minor:+m[2], patch:+m[3], beta:+m[4] };
            };
            const cmpStable = (a,b)=> a.major!==b.major?b.major-a.major : a.minor!==b.minor?b.minor-a.minor : b.patch-a.patch;
            const cmpBeta = (a,b)=> a.major!==b.major?b.major-a.major : a.minor!==b.minor?b.minor-a.minor : a.patch!==b.patch?b.patch-a.patch : b.beta-a.beta;

            const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });
            const names = tags.map(t=>t.name);
            const stable = names.map(parseStable).filter(Boolean).sort(cmpStable)[0]?.tag ?? 'none';
            const beta = names.map(parseBeta).filter(Boolean).sort(cmpBeta)[0]?.tag ?? 'none';

            const files = [
              {
                path: 'badges/stable.json',
                content: JSON.stringify({ schemaVersion:1, label:'stable', message: stable, color: stable==='none'?'lightgrey':'blue' }, null, 2) + '\n'
              },
              {
                path: 'badges/beta.json',
                content: JSON.stringify({ schemaVersion:1, label:'beta', message: beta, color: beta==='none'?'lightgrey':'orange' }, null, 2) + '\n'
              }
            ];

            // Ensure gh-pages exists
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (err) {
              if (err.status !== 404) throw err;
              const repoData = await github.rest.repos.get({ owner, repo });
              const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${repoData.data.default_branch}` });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseRef.data.object.sha });
            }

            for (const f of files) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({ owner, repo, path: f.path, ref: branch });
                if (!Array.isArray(existing.data) && existing.data.type === 'file') {
                  sha = existing.data.sha;
                  const prev = Buffer.from(existing.data.content, 'base64').toString('utf8');
                  if (prev === f.content) continue;
                }
              } catch (err) {
                if (err.status !== 404) throw err;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: f.path,
                message: `chore(badges): update ${f.path}`,
                content: Buffer.from(f.content, 'utf8').toString('base64'),
                branch,
                sha,
                committer: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' },
                author: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' }
              });
            }
