name: Semantic Release

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish semantic release
    # Avoid infinite loops on release commits generated by tooling.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install semantic-release tooling
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@8

      - name: Semantic release (dry-run on act)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${ACT:-}" == "true" ]]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
