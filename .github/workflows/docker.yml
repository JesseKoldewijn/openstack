name: Docker

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*.*.*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEMP_TAG_PREFIX: ci-${{ github.sha }}

jobs:
  metadata:
    name: Compute Docker metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      pr_rc_tag: ${{ steps.pr_rc.outputs.pr_rc_tag }}
      pr_latest_tag: ${{ steps.pr_rc.outputs.pr_latest_tag }}
      build_tag: ${{ steps.build_meta.outputs.build_tag }}
      build_sha: ${{ steps.build_meta.outputs.build_sha }}
    steps:
      - name: Checkout (for tag discovery)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR RC preview tag
        id: pr_rc
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --tags --force >/dev/null 2>&1 || true

          # Base PR preview tags on the latest rc tag available in the repo.
          # Example output: v1.0.0-rc-1.pr-abc1234
          base_rc_tag="$(git tag --list 'v*-rc-*' --sort=-version:refname | head -n 1)"

          if [[ -z "$base_rc_tag" ]]; then
            workspace_version="$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
            base_rc_tag="v${workspace_version}-rc-1"
          fi

          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          pr_rc_tag="${base_rc_tag}.pr-${short_sha}"
          pr_latest_tag="pr-${{ github.event.pull_request.number }}"

          echo "pr_rc_tag=${pr_rc_tag}" >> "$GITHUB_OUTPUT"
          echo "pr_latest_tag=${pr_latest_tag}" >> "$GITHUB_OUTPUT"
          echo "Computed PR RC tag: ${pr_rc_tag}"
          echo "Computed PR latest tag: ${pr_latest_tag}"

      - name: Compute build metadata
        id: build_meta
        run: |
          set -euo pipefail
          build_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            build_tag="${{ steps.pr_rc.outputs.pr_rc_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            build_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_tag="stable"
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            build_tag="rc"
          else
            build_tag="${GITHUB_REF_NAME}"
          fi

          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "build_sha=${build_sha}" >> "$GITHUB_OUTPUT"
          echo "Build metadata: tag=${build_tag}, sha=${build_sha}"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Stable channel (main)
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
            # Stable semver tags (from v*.*.* tag pushes)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # RC channel (develop)
            type=raw,value=rc,enable=${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
            type=sha,format=short,prefix=rc-,enable=${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
            # PR RC preview tags (rc-based with commit hash suffix)
            type=raw,value=${{ steps.pr_rc.outputs.pr_rc_tag }},enable=${{ github.event_name == 'pull_request' }}
            # Mutable PR pointer tag: always points to latest image for that PR
            type=raw,value=${{ steps.pr_rc.outputs.pr_latest_tag }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=openstack
            org.opencontainers.image.description=A Rust-based LocalStack drop-in replacement

  build:
    name: Build ${{ matrix.suffix }} image
    runs-on: ${{ matrix.runner }}
    needs: metadata
    permissions:
      contents: read
      # packages: write is required on non-pull_request events: this job pushes
      # per-arch temporary staging tags (ci-<sha>-amd64 / ci-<sha>-arm64) to
      # GHCR so the publish job can assemble the final multi-arch manifest.
      # Login and push are both gated on `github.event_name != 'pull_request'`,
      # so the permission is unused on PRs — but GitHub Actions does not
      # support per-event permission scoping within a single job definition.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            # Native ARM runner — no QEMU emulation required.
            # Note: ubuntu-24.04-arm is free for public repositories only.
            # Private repos require GitHub Team or Enterprise.
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set temporary image ref
        id: refs
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=${image_repo}:${{ env.TEMP_TAG_PREFIX }}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.suffix }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.refs.outputs.image_ref }}
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: |
            OPENSTACK_BUILD_TAG=${{ needs.metadata.outputs.build_tag }}
            OPENSTACK_BUILD_SHA=${{ needs.metadata.outputs.build_sha }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          # PRs must not write to the shared GHA cache — they could poison
          # the layer cache used by production push builds.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=docker-{0}', matrix.suffix) || '' }}

  publish:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [metadata, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify temp images exist
        id: verify
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          amd64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-amd64"
          arm64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-arm64"
          # Retry up to 5 times with 15s between attempts to allow for GHCR
          # propagation delay after a multi-architecture push.
          for attempt in 1 2 3 4 5; do
            missing=0
            docker buildx imagetools inspect "$amd64_ref" >/dev/null 2>&1 || missing=1
            docker buildx imagetools inspect "$arm64_ref" >/dev/null 2>&1 || missing=1
            if [ "$missing" -eq 0 ]; then
              echo "Both temp images verified on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/5: one or more temp images not yet visible — waiting 15s..."
            sleep 15
          done
          echo "::error::Temporary images did not become visible in GHCR after 5 attempts (amd64: ${amd64_ref}, arm64: ${arm64_ref})"
          exit 1

      - name: Create and push multi-arch manifest
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          amd64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-amd64"
          arm64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-arm64"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.title=openstack" \
              --annotation "index:org.opencontainers.image.description=A Rust-based LocalStack drop-in replacement" \
              --annotation "index:org.opencontainers.image.url=https://github.com/JesseKoldewijn/openstack" \
              --annotation "index:org.opencontainers.image.source=https://github.com/JesseKoldewijn/openstack" \
              --annotation "index:org.opencontainers.image.licenses=MIT" \
              -t "$tag" \
              "$amd64_ref" \
              "$arm64_ref"
          done <<< "${{ needs.metadata.outputs.tags }}"

      - name: Validate manifest platforms
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            manifest="$(docker buildx imagetools inspect "$tag")"
            printf '%s' "$manifest" | grep -q "linux/amd64"
            printf '%s' "$manifest" | grep -q "linux/arm64"
          done <<< "${{ needs.metadata.outputs.tags }}"

  cleanup-temp-tags:
    name: Cleanup temporary CI + PR preview tags
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs: [publish, metadata]
    permissions:
      packages: write
    steps:
      - name: Delete temporary staging + PR preview tags from GHCR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="openstack"
          OWNER="${{ github.repository_owner }}"

          tags_to_cleanup=(
            "ci-${{ github.sha }}-amd64"
            "ci-${{ github.sha }}-arm64"
          )

          short_sha=""
          current_pr_rc_tag=""
          current_pr_latest_tag=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            short_sha="$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
            current_pr_rc_tag="${{ needs.metadata.outputs.pr_rc_tag }}"
            current_pr_latest_tag="${{ needs.metadata.outputs.pr_latest_tag }}"
          fi

          for TAG in "${tags_to_cleanup[@]}"; do
            echo "Looking up temp/preview tag: ${TAG}" >&2

            VERSION_ID=$(gh api \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"${TAG}\")) | .id")

            if [[ -n "$VERSION_ID" ]]; then
              echo "Deleting version ${VERSION_ID} (tag: ${TAG})" >&2
              gh api -X DELETE \
                "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" \
                && echo "  Deleted." >&2 || echo "  Failed to delete." >&2
            else
              echo "  Tag ${TAG} not found — skipping." >&2
            fi
          done

          # PR preview tags follow: vX.Y.Z-rc-N.pr-<shortsha>
          # Keep the current PR image (which carries both current_pr_rc_tag and
          # current_pr_latest_tag), and prune older preview versions for this PR.
          if [[ -n "$short_sha" ]]; then
            echo "Looking up stale PR preview tags ending with .pr-*${short_sha}" >&2
            VERSION_IDS=$(gh api \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              --paginate \
              --jq ".[]
                | select(any(.metadata.container.tags[]?; test(\"\\.pr-[0-9a-f]{7}$\")))
                | select((.metadata.container.tags | index(\"${current_pr_latest_tag}\")) | not)
                | .id")

            if [[ -n "$VERSION_IDS" ]]; then
              while IFS= read -r VERSION_ID; do
                [[ -z "$VERSION_ID" ]] && continue
                echo "Deleting stale PR preview version ${VERSION_ID}" >&2
                gh api -X DELETE \
                  "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" \
                  && echo "  Deleted." >&2 || echo "  Failed to delete." >&2
              done <<< "$VERSION_IDS"
            else
              echo "No stale PR preview versions found" >&2
            fi
          fi
