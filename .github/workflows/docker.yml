name: Docker

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEMP_TAG_PREFIX: ci-${{ github.sha }}

jobs:
  metadata:
    name: Compute Docker metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
            type=ref,event=pr

  build:
    name: Build ${{ matrix.suffix }} image
    runs-on: ${{ matrix.runner }}
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            # Native ARM runner — no QEMU emulation required.
            # Note: ubuntu-24.04-arm is free for public repositories only.
            # Private repos require GitHub Team or Enterprise.
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set temporary image ref
        id: refs
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=${image_repo}:${{ env.TEMP_TAG_PREFIX }}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.suffix }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.refs.outputs.image_ref }}
          labels: ${{ needs.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

  publish:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [metadata, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify temp images exist
        id: verify
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          amd64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-amd64"
          arm64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-arm64"
          skip=false
          if ! docker buildx imagetools inspect "$amd64_ref" >/dev/null 2>&1; then
            echo "::warning::amd64 temp image not found ($amd64_ref) — skipping publish"
            skip=true
          fi
          if ! docker buildx imagetools inspect "$arm64_ref" >/dev/null 2>&1; then
            echo "::warning::arm64 temp image not found ($arm64_ref) — skipping publish"
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        if: steps.verify.outputs.skip != 'true'
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          amd64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-amd64"
          arm64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-arm64"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "$tag" \
              "$amd64_ref" \
              "$arm64_ref"
          done <<< "${{ needs.metadata.outputs.tags }}"

      - name: Validate manifest platforms
        if: steps.verify.outputs.skip != 'true'
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            manifest="$(docker buildx imagetools inspect "$tag")"
            printf '%s' "$manifest" | grep -q "linux/amd64"
            printf '%s' "$manifest" | grep -q "linux/arm64"
          done <<< "${{ needs.metadata.outputs.tags }}"

  cleanup-temp-tags:
    name: Cleanup temporary CI tags
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      packages: write
    steps:
      - name: Delete temporary staging tags from GHCR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="openstack"
          OWNER="${{ github.repository_owner }}"

          for suffix in amd64 arm64; do
            TAG="ci-${{ github.sha }}-${suffix}"
            echo "Looking up temp tag: ${TAG}" >&2

            VERSION_ID=$(gh api \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"${TAG}\")) | .id")

            if [[ -n "$VERSION_ID" ]]; then
              echo "Deleting version ${VERSION_ID} (tag: ${TAG})" >&2
              gh api -X DELETE \
                "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" \
                && echo "  Deleted." >&2 || echo "  Failed to delete." >&2
            else
              echo "  Tag ${TAG} not found — skipping." >&2
            fi
          done
