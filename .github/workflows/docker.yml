name: Docker

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEMP_TAG_PREFIX: ci-${{ github.sha }}

jobs:
  metadata:
    name: Compute Docker metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      build_tag: ${{ steps.build_meta.outputs.build_tag }}
      build_sha: ${{ steps.build_meta.outputs.build_sha }}
    steps:
      - name: Compute build metadata
        id: build_meta
        run: |
          set -euo pipefail
          build_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            build_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_tag="stable"
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            build_tag="beta"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            build_tag="pr-${{ github.event.pull_request.number }}"
          else
            build_tag="${GITHUB_REF_NAME}"
          fi

          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "build_sha=${build_sha}" >> "$GITHUB_OUTPUT"
          echo "Build metadata: tag=${build_tag}, sha=${build_sha}"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Stable channel (main)
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
            # Canary/Beta channel (develop)
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
            type=sha,format=short,prefix=beta-,enable=${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
            # SemVer tags (stable + beta prerelease tags)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=openstack
            org.opencontainers.image.description=A Rust-based LocalStack drop-in replacement

  build:
    name: Build ${{ matrix.suffix }} image
    runs-on: ${{ matrix.runner }}
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set temporary image ref
        id: refs
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=${image_repo}:${{ env.TEMP_TAG_PREFIX }}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.suffix }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.refs.outputs.image_ref }}
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: |
            OPENSTACK_BUILD_TAG=${{ needs.metadata.outputs.build_tag }}
            OPENSTACK_BUILD_SHA=${{ needs.metadata.outputs.build_sha }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=docker-{0}', matrix.suffix) || '' }}

  publish:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [metadata, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify temp images exist
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          amd64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-amd64"
          arm64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-arm64"
          for attempt in 1 2 3 4 5; do
            missing=0
            docker buildx imagetools inspect "$amd64_ref" >/dev/null 2>&1 || missing=1
            docker buildx imagetools inspect "$arm64_ref" >/dev/null 2>&1 || missing=1
            if [ "$missing" -eq 0 ]; then
              echo "Both temp images verified on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/5: temp images not yet visible — waiting 15s..."
            sleep 15
          done
          echo "::error::Temporary images did not become visible in GHCR after 5 attempts"
          exit 1

      - name: Create and push multi-arch manifest
        run: |
          image_repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image_repo="$(printf '%s' "$image_repo" | tr '[:upper:]' '[:lower:]')"
          amd64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-amd64"
          arm64_ref="${image_repo}:${{ env.TEMP_TAG_PREFIX }}-arm64"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.title=openstack" \
              --annotation "index:org.opencontainers.image.description=A Rust-based LocalStack drop-in replacement" \
              --annotation "index:org.opencontainers.image.url=https://github.com/JesseKoldewijn/openstack" \
              --annotation "index:org.opencontainers.image.source=https://github.com/JesseKoldewijn/openstack" \
              --annotation "index:org.opencontainers.image.licenses=MIT" \
              -t "$tag" \
              "$amd64_ref" \
              "$arm64_ref"
          done <<< "${{ needs.metadata.outputs.tags }}"

  cleanup-temp-tags:
    name: Cleanup temporary CI tags
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      packages: write
    steps:
      - name: Delete temporary staging tags from GHCR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="openstack"
          OWNER="${{ github.repository_owner }}"

          for TAG in "ci-${{ github.sha }}-amd64" "ci-${{ github.sha }}-arm64"; do
            VERSION_ID=$(gh api \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"${TAG}\")) | .id")

            if [[ -n "$VERSION_ID" ]]; then
              gh api -X DELETE \
                "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" >/dev/null 2>&1 || true
              echo "Deleted temp tag ${TAG} (version ${VERSION_ID})"
            fi
          done
