name: Develop RC Tag

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: develop-rc-tag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-rc-tag:
    if: github.ref == 'refs/heads/develop'
    name: Create RC tag for develop head
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push next RC tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Skip if this commit is already tagged as an RC.
          existing_for_head="$(git tag --points-at HEAD 'v*-rc-*' | head -n 1)"
          if [[ -n "$existing_for_head" ]]; then
            echo "HEAD already has RC tag: $existing_for_head"
            exit 0
          fi

          # RC stream is based on workspace semantic version.
          workspace_version="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_workspace_package=1; next }
            /^\[/ { in_workspace_package=0 }
            in_workspace_package && /^version = / { print $2; exit }
          ' Cargo.toml)"
          [[ -n "$workspace_version" ]] || {
            echo "Unable to determine [workspace.package].version from Cargo.toml" >&2
            exit 1
          }
          base_stable="v${workspace_version}"
          echo "Using workspace version base: ${base_stable}" >&2

          # Find highest existing rc number for this stable base.
          highest=0
          while IFS= read -r t; do
            [[ -z "$t" ]] && continue
            n="${t##*-rc-}"
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n > highest )); then
              highest="$n"
            fi
          done < <(git tag --list "${base_stable}-rc-*" --sort=-version:refname)

          next=$((highest + 1))
          new_tag="${base_stable}-rc-${next}"

          echo "Creating RC tag: ${new_tag}"
          git tag -a "$new_tag" -m "RC release ${new_tag}"
          git push origin "$new_tag"

          {
            echo "## Develop RC tag"
            echo ""
            echo "Created: \\`${new_tag}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
