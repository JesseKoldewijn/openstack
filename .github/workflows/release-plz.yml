name: Release PR (SemVer)

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    if: github.ref == 'refs/heads/develop'
    name: Create/Update release PR (develop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure release labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = [
              { name: 'release', color: '0e8a16', description: 'Release automation PR' },
              { name: 'semver', color: '1d76db', description: 'SemVer-driven change' },
            ];

            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: l.name });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...l });
                  core.notice(`Created missing label: ${l.name}`);
                } else {
                  throw err;
                }
              }
            }

      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: .release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  cleanup-stale-release-plz-branches:
    name: Cleanup stale release-plz branches
    if: always() && github.ref == 'refs/heads/develop'
    needs: [release-pr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete release-plz-* branches without open PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Gather open PR head branches first.
            const openHeadBranches = new Set();
            for await (const res of github.paginate.iterator(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })) {
              for (const pr of res.data) {
                if (pr.head?.repo?.full_name === `${owner}/${repo}` && pr.head?.ref) {
                  openHeadBranches.add(pr.head.ref);
                }
              }
            }

            // List candidate branches.
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const candidates = branches
              .map(b => b.name)
              .filter(name => name.startsWith('release-plz-'));

            let deleted = 0;
            for (const branch of candidates) {
              if (openHeadBranches.has(branch)) {
                core.info(`Keeping ${branch}: linked to open PR`);
                continue;
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              core.notice(`Deleted stale branch: ${branch}`);
              deleted += 1;
            }

            core.notice(`Cleanup complete. Deleted ${deleted} stale release-plz branch(es).`);
