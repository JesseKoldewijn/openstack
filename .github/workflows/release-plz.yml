name: Release PR (SemVer)

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    name: Create/Update release PR (develop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure release labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = [
              { name: 'release', color: '0e8a16', description: 'Release automation PR' },
              { name: 'semver', color: '1d76db', description: 'SemVer-driven change' },
            ];

            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: l.name });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...l });
                  core.notice(`Created missing label: ${l.name}`);
                } else {
                  throw err;
                }
              }
            }

      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: .release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
