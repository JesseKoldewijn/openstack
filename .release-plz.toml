[workspace]
# Open release PRs that bump crate versions based on conventional commits
# (feat -> minor, fix/perf -> patch, BREAKING CHANGE/! -> major).
changelog_update = true
dependencies_update = true
pr_name = "chore(release): release-plz"
pr_labels = ["release", "semver"]
pr_draft = false

# GitHub release / git tag settings.
git_release_enable = true
git_tag_name = "v{{ version }}"

# This project currently does not publish crates to crates.io.
publish = false

# Keep release-plz robust in CI-only environments.
allow_dirty = false
